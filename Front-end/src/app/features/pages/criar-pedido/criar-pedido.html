<p-toast></p-toast>
<div class="container">
  <form [formGroup]="formulario" (ngSubmit)="criarPedido()" class="conteudo">
    <label for="nome">Nome do Pedido</label>
    <input pInputText id="nome" formControlName="nome" />

    <label>Selecione os Produtos</label>
   
      <app-lista-produtos
        [produtos]="(produtos$ | async)"
        [control]="formulario.get('produtosSelecionados')"
        ></app-lista-produtos>
    

    <p-button label="Finalizar Pedido" type="submit" [disabled]="formulario.invalid"></p-button>

    @if (formulario.get('produtosSelecionados')?.hasError('limiteExcedido')) {
      <small class="text-red-500 flex items-center gap-1 mt-2 font-medium">
        <i class="pi pi-times-circle"></i>
        Erro: Você não pode selecionar mais do que 5 produtos.
      </small>
    }
  </form>
</div>
